<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Ficha do Domador - Amiel Jones</title>
    <style>{{STYLES}}</style>
</head>

<body>

    <div class="page">
        <h1>Ficha do Domador</h1>

        <div class="grid-5">
            <div class="box"><label>Nome</label><input type="text" id="charName" value=""></div>
            <div class="box"><label>Nível</label><input type="number" value=""></div>
            <div class="box"><label>PV Máximo</label><input type="number" value=""></div>
            <div class="box"><label>Deslocamento (Q)</label><input type="number" min="1" value=""></div>
            <div class="box"><label>P. Aspecto</label><input type="number" value=""></div>
        </div>

        <div class="grid-5" style="margin-top: 10px;">
            <div class="box"><label>Sexo</label><input type="text" value=""></div>
            <div class="box"><label>Idade</label><input type="number" value=""></div>
            <div class="box"><label>Altura (m)</label><input type="number" step="0.1" min="1.0" max="2.5" value="">
            </div>
            <div class="box"><label>Etnia</label><input type="text" value=""></div>
            <div class="box"><label>Nacionalidade</label><input type="text" value=""></div>
        </div>

        <div class="title-bar">CONVICÇÃO &amp; ASPECTOS</div>
        <div class="box" style="margin-bottom: 10px; border-left: 5px solid #e67e22;">
            <input type="text" value="Convicção" style="font-size: 14px; color: #d35400;">
            <textarea rows="2"></textarea>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="box"><input type="text" value="Aspecto 1"><textarea rows="4">Descrição</textarea></div>
            <div class="box"><input type="text" value="Aspecto 2"><textarea rows="4">Descrição</textarea></div>
            <div class="box"><input type="text" value="Aspecto 3"><textarea rows="4">Descrição</textarea></div>
            <div class="box"><input type="text" value="Aspecto 4"><textarea rows="4">Descrição</textarea></div>
        </div>

{{COMPONENT_SOCIAL_ATTRIBUTES}}
        <div class="title-bar">
            HABILIDADES
            <button type="button" id="addSkillBtn" class="btn-add" aria-label="Adicionar habilidade"
                title="Adicionar habilidade">+</button>
        </div>
        <div id="skillsContainer">




        </div>



{{COMPONENT_INVENTORY}}
        <div class="title-bar">TRABALHO</div>
        <div class="grid-4" style="display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 12px; margin-bottom: 10px;">
            <div class="box"><label>Ocupação</label><input type="text" value=""></div>
            <div class="box"><label>Ganho Semanal (PR)</label><input type="number" step="0.25" value=""></div>
            <div class="box"><label>Horário</label><input type="text" value=""></div>
        </div>
        <div class="grid-4" style="gap: 12px; margin-bottom: 20px;">
            <div class="box"><label>Saldo (PR)</label><input type="number" step="0.25" value=""></div>
            <div class="box"><label>Custo Semanal (PR)</label><input type="number" step="0.25" value=""></div>
            <div class="box"><label>Atributo</label><input type="text" value=""></div>
            <div class="box"><label>Bônus</label><input type="text" value=""></div>
        </div>

        <div class="title-bar">ANOTAÇÕES</div>
        <textarea class="notes-area" placeholder="Anotações da campanha..." style="height: 354px;"></textarea>
    </div>
{{COMPONENT_MODAL}}
<button type="button" id="btnSalvar"><span aria-hidden="true">💾</span> Baixar Ficha</button>
    <script>{{SCRIPTS}}</script>

</body>

</html>
