<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>DRPG - Ficha de Digimon</title>
    <style>{{STYLES}}</style>
</head>

<body>

    <div class="page">
        <h1>DIGIMON RPG</h1>

        <div class="grid-4">
            <div class="box"><label for="charName">Espécie</label><input type="text" id="charName" value=""></div>
            <div class="box"><label for="digimonLevel">Nível</label><input type="text" id="digimonLevel" value=""></div>
            <div class="box"><label for="singularity">Singularidade</label><input type="text" id="singularity" value=""></div>
            <div class="box"><label for="field">Campo</label><input type="text" id="field" value=""></div>
            <div class="box"><label for="size">Tamanho</label><input type="text" id="size" value=""></div>
            <div class="box"><label for="movement">Deslocamento</label><input type="text" id="movement" value=""></div>
            <div class="box"><label for="sense">Sentido</label><input type="text" id="sense" value=""></div>
        </div>

        <div class="title-bar">ATRIBUTOS</div>
        <div class="grid-4">
            <div class="box"><label for="digitalHealth">Saúde Digital (SD)</label><input type="text" id="digitalHealth" value=""></div>
            <div class="box"><label for="temporaryHealth">Saúde Temporária</label><input type="text" id="temporaryHealth" value=""></div>
            <div class="box"><label for="energy">Energia</label><input type="text" id="energy" value=""></div>
            <div class="box"><label for="temporaryEnergy">Energia Temporária</label><input type="text" id="temporaryEnergy" value=""></div>
            <div class="box"><label for="strength">Força</label><input type="number" id="strength" min="1" value=""></div>
            <div class="box"><label for="agility">Agilidade</label><input type="number" id="agility" min="1" value=""></div>
            <div class="box"><label for="precision">Precisão</label><input type="number" id="precision" min="1" value=""></div>
            <div class="box"><label for="vitality">Vitalidade</label><input type="number" id="vitality" min="1" value=""></div>
            <div class="box"><label for="spirit">Espírito</label><input type="number" id="spirit" min="1" value=""></div>
            <div class="box"><label for="adaptability">Adaptabilidade</label><input type="number" id="adaptability" min="1" value=""></div>
            <div class="box"><label for="energyLimit">Lmt. Energia</label><input type="number" id="energyLimit" min="1" value=""></div>
            <div class="box" role="group" aria-labelledby="memoryLabel"><span id="memoryLabel" class="field-label">Memória</span>
                <div style="display: flex; align-items: center; justify-content: space-around; gap: 5px;">
                    <div style="text-align: center;"><label for="memoryBalance" style="font-size: 7px; margin-bottom: 0;">SALDO</label>
                        <input type="number" id="memoryBalance" value="0" style="width: 35px; text-align: center;">
                    </div>

                    <span style="color: #24658f; font-weight: bold; margin-top: 10px;">|</span>

                    <div style="text-align: center;"><label for="memoryTotal" style="font-size: 7px; margin-bottom: 0;">TOTAL</label>
                        <input type="number" id="memoryTotal" value="0" style="width: 35px; text-align: center;">
                    </div>
                </div>
            </div>
        </div>

        <div class="title-bar">COMBATE</div>

        <div class="grid-2">
            <div class="box" style="margin-bottom: 10px;"><label for="spellList">Lista de Magias</label><input type="text" id="spellList" value="">
            </div>
            <div class="box" style="margin-bottom: 10px;">
                <label for="conditionSelectTrigger">Condições</label>
                <div class="multiselect">
                    <button type="button" class="selectBox" id="conditionSelectTrigger" aria-expanded="false"
                        aria-controls="checkboxes" aria-haspopup="true">
                        <span id="displayValue">Selecionar Condições...</span>
                        <span class="overSelect"></span>
                    </button>

                    <div id="checkboxes" style="display: none;" role="group" aria-label="Condições do Digimon">
                        <div class="group-title">MENTAIS</div>
                        <label><input type="checkbox" value="Abalado"> Abalado</label>
                        <label><input type="checkbox" value="Encantado"> Encantado</label>
                        <label><input type="checkbox" value="Em Pânico"> Em Pânico</label>
                        <label><input type="checkbox" value="Amedrontrado">
                            Amedrontrado</label>
                        <label><input type="checkbox" value="Fascinado"> Fascinado</label>
                        <label><input type="checkbox" value="Enfurecido"> Enfurecido</label>
                        <label><input type="checkbox" value="Fatigado"> Fatigado</label>
                        <label><input type="checkbox" value="Frustrado"> Frustrado</label>
                        <label><input type="checkbox" value="Sonolento"> Sonolento</label>
                        <label><input type="checkbox" value="Provocado"> Provocado</label>

                        <div class="group-title">NERVOSAS</div>
                        <label><input type="checkbox" value="Ofuscado"> Ofuscado</label>
                        <label><input type="checkbox" value="Atordoado"> Atordoado</label>
                        <label><input type="checkbox" value="Em Choque"> Em Choque</label>
                        <label><input type="checkbox" value="Lento"> Lento</label>
                        <label><input type="checkbox" value="Imóvel"> Imóvel</label>
                        <label><input type="checkbox" value="Enjoado"> Enjoado</label>
                        <label><input type="checkbox" value="Paralisado"> Paralisado</label>

                        <div class="group-title">CORPORAIS</div>
                        <label><input type="checkbox" value="Agarrado"> Agarrado</label>
                        <label><input type="checkbox" value="Contaminado">
                            Contaminação</label>
                        <label><input type="checkbox" value="Congelado"> Congelado</label>
                        <label><input type="checkbox" value="Envenenado"> Veneno</label>
                        <label><input type="checkbox" value="Derrubado"> Derrubado</label>
                        <label><input type="checkbox" value="Hidratado"> Hidratado</label>
                        <label><input type="checkbox" value="Encharcado"> Encharcado</label>
                        <label><input type="checkbox" value="Abençoado"> Abençoado</label>
                        <label><input type="checkbox" value="Amaldiçoado">
                            Amaldiçoado</label>
                        <label><input type="checkbox" value="Chamuscado"> Chamuscar</label>
                        <label><input type="checkbox" value="Fortificado">
                            Fortificar</label>
                        <label><input type="checkbox" value="Sangrando"> Sangrando</label>
                        <label><input type="checkbox" value="DOT"> DOT</label>

                        <div class="group-title">ESPECIAIS</div>
                        <label><input type="checkbox" value="sob_portas_da_morte"> Sob
                            Portas da Morte</label>
                        <label><input type="checkbox" value="morto"> Morto</label>
                        <label><input type="checkbox" value="inconsciente">
                            Inconsciente</label>
                    </div>
                </div>
            </div>
        </div>
        <div class="grid-2">
            <div class="box" style="margin-bottom: 10px;"><label for="resistance">Resistência</label><input type="text" id="resistance" value="">
            </div>
            <div class="box" style="margin-bottom: 10px;"><label for="vulnerability">Vulnerabilidade</label><input type="text" id="vulnerability" value="">
            </div>
        </div>

        <div class="grid-4">
            <div class="box"><label for="initiative">Iniciativa</label><input type="number" id="initiative" value="0"></div>
            <div class="box"><label for="accuracy">Acerto</label><input type="number" id="accuracy" value="0"></div>
            <div class="box"><label for="evasion">Esquiva</label><input type="number" id="evasion" value="0"></div>
            <div class="box"><label for="fortification">Fortificação</label><input type="number" id="fortification" value="0"></div>
            <div class="box"><label for="stealth">Furtividade</label><input type="number" id="stealth" value="0"></div>
            <div class="box"><label for="maneuver">Manobra</label><input type="number" id="maneuver" value="0"></div>
            <div class="box"><label for="bca">BCA</label><input type="number" id="bca" min="-3" max="3" value="0"></div>
            <div class="box"><label for="bce">BCE</label><input type="number" id="bce" min="-3" max="3" value="0"></div>
        </div>

{{COMPONENT_INVENTORY}}
        <div class="title-bar">
            HABILIDADES
            <button type="button" id="addSkillBtn" class="btn-add" aria-label="Adicionar habilidade"
                title="Adicionar habilidade">+</button>
        </div>
        <div id="skillsContainer">




        </div>

        <div class="title-bar">
            PODERES
            <button type="button" id="addPowerBtn" class="btn-add" aria-label="Adicionar poder"
                title="Adicionar poder">+</button>
        </div>
        <div id="powersContainer"></div>

        <div class="title-bar" id="notesTitle">ANOTAÇÕES</div>
        <textarea class="notes-area" aria-labelledby="notesTitle" placeholder="Anotações da campanha..."></textarea>
    </div>





    <button type="button" id="btnSalvar"><span aria-hidden="true">💾</span> Baixar Ficha</button>

{{COMPONENT_MODAL}}
    <script>{{SCRIPTS}}</script>

</body>

</html>
